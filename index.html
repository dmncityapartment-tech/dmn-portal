<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMN City Apartments • Management Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Background Glow -->
  <div class="glow-bg"></div>

  <!-- Centered Canvas Container -->
  <main class="canvas-container">
    <div class="portal-card">
      
      <!-- Stylized Building Logo Emblem -->
      <div class="logo-wrapper">
        <div class="logo-emblem">
          <svg class="building-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 40V18L24 10L34 18V40H14Z" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M8 40V24L14 19" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>
            <path d="M40 40V24L34 19" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>
            <path d="M20 22H28M20 28H28M20 34H28" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 40H44" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round"/>
            <defs>
              <linearGradient id="goldGradient" x1="4" y1="10" x2="44" y2="40" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FCD34D"/>
                <stop offset="0.5" stop-color="#F59E0B"/>
                <stop offset="1" stop-color="#D97706"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="emblem-tag">DMN CITY</span>
        </div>
      </div>

      <!-- Canvas Brand Headings -->
      <h1 class="portal-title">DMN CITY APARTMENTS</h1>
      <p class="portal-subtitle">Luxury Self-Catering Apartments • Management Portal</p>

      <!-- Canvas Primary Action Button -->
      <div class="action-section">
        <button id="btnLoginDialog" class="canvas-btn">
          <span class="btn-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </span>
          <span class="btn-text">Login Dialogue Box</span>
        </button>
      </div>

      <!-- Live Sync Indicator -->
      <div class="sync-status">
        <span class="status-indicator"></span>
        <span>Google Sheets Sync Active • 2026 Reporting</span>
      </div>

    </div>
  </main>

  <!-- Login Dialogue Box (Modal Popup) -->
  <div class="modal-overlay" id="loginModal">
    <div class="dialogue-box">
      <div class="dialogue-header">
        <div class="dialogue-title-group">
          <h3>Portal Authentication</h3>
          <p>DMN City Apartments Management Hub</p>
        </div>
        <button class="dialogue-close" id="btnCloseModal">&times;</button>
      </div>

      <form id="authForm" class="dialogue-body">
        <div class="form-field">
          <label for="staffId">Staff ID / Username</label>
          <input type="text" id="staffId" placeholder="e.g. DMN-ADM01" required autocomplete="username" />
        </div>

        <div class="form-field">
          <label for="accessPin">Access PIN / Password</label>
          <input type="password" id="accessPin" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <div class="dialogue-options">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked />
            <span>Stay connected</span>
          </label>
          <a href="#" class="forgot-link">Assistance?</a>
        </div>

        <button type="submit" class="submit-auth-btn" id="btnSubmitAuth">
          <span>Authorize Access</span>
          <svg viewBox="0 0 20 20" fill="currentColor" class="submit-arrow">
            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
